# Multi-Robot Swarm Configuration
# Author: Chandan Sheikder
# Date: 2026-08-15

# Simulation Parameters
simulation:
  sim_time: 60.0  # seconds
  time_step: 0.05  # seconds (50ms)
  
# Arena Parameters
arena:
  width: 8.0  # meters
  height: 8.0  # meters
  grid_resolution: 0.05  # meters per cell
  
# Robot Parameters
robot:
  num_robots: 20
  radius: 0.08  # meters
  max_speed: 0.15  # m/s
  turn_rate: 1.5  # rad/s
  wheel_base: 0.1  # meters
  
# Pheromone Parameters
pheromone:
  decay_rate: 0.02  # per second
  deposit_intensity: 200  # 0-255
  max_intensity: 255
  trail_spread: 0.05  # meters
  
# Sensor Parameters
sensors:
  tcrt5000:
    num_sensors: 4
    sensor_range: 0.05  # meters
    noise_level: 0.02  # meters
    
  mq135:
    warmup_time: 90  # seconds (updated from 30s)
    sensitivity: 'TVOC'
    
# SLAM Parameters
slam:
  algorithm: 'slam_toolbox'
  scan_range_max: 12.0  # meters
  scan_angle: 360  # degrees
  
# Network Parameters
network:
  enable_viz: true
  log_data: true
  record_bag: true
  
# Task Parameters
task:
  num_targets: 5
  target_radius: 0.3  # meters
